name: Checks

# Reusable workflow - called by ci.yml and release.yml (as a gate before building the image).
# Callers pass UV_INDEX explicitly to make it available to the jobs below.
on:
  workflow_call:
    secrets:
      UV_INDEX:
        # Optional: forks and local `act` runs without the secret fall back to public PyPI only,
        # which is intentional.
        required: false

# Least-privilege default; no job here needs write access.
permissions: {}

env:
  UV_INDEX: ${{ secrets.UV_INDEX }}

jobs:
  # -- Wave 1: fast static, all parallel ---------------------------

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          uv-sync-args: "--frozen --only-group lint"

      - name: Check lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check --diff src tests
  
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          uv-sync-args: "--frozen --only-group type-check"
      
      - run: uv run mypy --config=pyproject.toml .

  security:
    name: Security (bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          uv-sync-args: "--frozen --only-group security"

      - run: uv run bandit -r src --config pyproject.toml
  
  # -- Wave 2: unit tests - only after all checks pass -------------

  test-unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint, type-check, security]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          uv-sync-args: "--frozen --only-group test"

      - name: Run unit tests
        run: uv run pytest -svvv tests/unit --cov=src --cov-branch --cov-report=term-missing
