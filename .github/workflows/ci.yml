name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch on new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; no job here needs write access.
permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets:
      UV_INDEX: ${{ secrets.UV_INDEX }}
