name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default; no job here needs write access.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -- Gate: run the full check suite before building the image ----
  checks:
    uses: ./.github/workflows/_static_checks.yml
    secrets:
      UV_INDEX: ${{ secrets.UV_INDEX }}

  test:
    needs: [checks]
    uses: ./.github/workflows/_tests.yml
    secrets:
      UV_INDEX: ${{ secrets.UV_INDEX }}

  # -- Build and push Docker image ---------------------------------

  build-image:
    name: Build & push image (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [checks, test]

    permissions:
      contents: read
      packages: write  # required to push docker image

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag & extract version
        # Allow following semver tags: v1.0.0, v1.2.3-beta1, v2.0.0-rc1
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((beta|rc)[0-9]+))?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Pre-release tags (beta/rc) must not become `latest`.
          if [[ "$VERSION" == *-beta* || "$VERSION" == *-rc* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatic, no extra secret needed for ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        run: |
          TAGS="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            TAGS="${TAGS}"$'\n'"${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.TAGS }}
          # pass the private index URL as a build secret so it never lands in an image layer
          secrets: |
            uv_index=${{ secrets.UV_INDEX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
