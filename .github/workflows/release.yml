name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default; no job here needs write access.
permissions: {}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -- Gate: run the full check suite before building the image ----
  checks:
    uses: ./.github/workflows/checks.yml
    secrets:
      UV_INDEX: ${{ secrets.UV_INDEX }}

  # -- Build and push Docker image ---------------------------------

  build-image:
    name: Build & push image (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [checks]
    
    permissions:
      contents: read
      packages: write  # required to push docker image

    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag
        # Allow following semver tags: v1.0.0, v1.2.3-beta1, v2.0.0-rc1
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((beta|rc)[0-9]+))?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatic, no extra secret needed for ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        # github.ref_name = "v1.2.3" -> strip the leading "v"
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # pass the private index URL as a build secret so it never lands in an image layer
          secrets: |
            uv_index=${{ secrets.UV_INDEX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
