name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default; jobs that need more widen it themselves.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -- Gate: run the full check suite before building the image ----
  checks:
    uses: ./.github/workflows/_static_checks.yml
    secrets:
      UV_INDEX: ${{ secrets.UV_INDEX }}

  test:
    needs: [checks]
    uses: ./.github/workflows/_tests.yml
    secrets:
      UV_INDEX: ${{ secrets.UV_INDEX }}

  # -- Build and push Docker image ---------------------------------

  build-image:
    name: Build & push image (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [checks, test]

    permissions:
      contents: read
      packages: write  # required to push docker image

    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag
        # docker/metadata-action parses semver leniently and silently emits fewer
        # tags for input it does not recognise. This step is the explicit gate on
        # what counts as a release tag here: v1.0.0, v1.2.3-beta1, v2.0.0-rc1.
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((beta|rc)[0-9]+))?$ ]]; then
            echo "::error::Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatic, no extra secret needed for ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags and labels
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest=auto` moves the latest tag only for stable releases; the action
          # runs semver.prerelease() on the version and skips beta and rc tags.
          flavor: latest=auto
          # Pre-releases yield only the {{version}} tag: the rolling {{major}}.{{minor}}
          # tag is deliberately not moved by a beta or an rc. The sha- tag pins the
          # image to its source commit and, unlike a semver tag, cannot be repointed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # source, revision, created, version and url are filled in from the workflow
          # context. `source` is what links the package to this repository in the
          # GitHub UI; `revision` records the full commit the image was built from.
          labels: |
            org.opencontainers.image.title=wrms-backend
            org.opencontainers.image.description=WRMS backend service

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # labels land in the image config, annotations on the manifest; registries
          # and tooling read different ones, so both are set.
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # pass the private index URL as a build secret so it never lands in an image layer
          secrets: |
            uv_index=${{ secrets.UV_INDEX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise published image
        # The digest is the immutable reference to deploy; the tags are for humans.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            echo '```'
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
